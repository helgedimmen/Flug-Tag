name: Deploy to GitHub Pages

# Publishes the static export to GitHub Pages. The workflow enables Pages itself
# (configure-pages enablement), so the only manual step is making the repo
# public — GitHub Pages on the Free plan requires a public repo.
# Served at https://helgedimmen.github.io/Flug-Tag/

on:
  push:
    branches:
      - claude/flight-radar-game-va9AK
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Configure + enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build static export
        run: npm run build
        env:
          # Project Pages sites are served from /<repo>/, so build under that path.
          PAGES_BASE_PATH: /Flug-Tag
      - name: Disable Jekyll (serve _next/ assets)
        run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
