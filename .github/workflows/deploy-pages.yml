name: Deploy to GitHub Pages

# Builds the static export and publishes it to GitHub Pages so the game can be
# played from a normal URL (https://<user>.github.io/Flug-Tag/).
# One-time setup: repo Settings → Pages → "Build and deployment" → Source:
# "GitHub Actions". After that, every push to this branch redeploys.

on:
  push:
    branches:
      - claude/flight-radar-game-va9AK
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build static export
        run: npm run build
        env:
          GITHUB_PAGES: "true"
      - name: Disable Jekyll (serve _next/ assets)
        run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
